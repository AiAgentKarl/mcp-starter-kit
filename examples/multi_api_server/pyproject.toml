[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multi-api-mcp-server"
version = "0.1.0"
description = "MCP-Server der mehrere APIs kombiniert — Fortgeschrittenes Beispiel"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
multi-api-mcp-server = "multi_api_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/multi_api_server"]
