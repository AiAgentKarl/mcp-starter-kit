[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "joke-mcp-server"
version = "0.1.0"
description = "MCP-Server der zufällige Witze liefert — Beispiel für Einsteiger"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
joke-mcp-server = "joke_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/joke_server"]
