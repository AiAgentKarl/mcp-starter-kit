[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "github-mcp-server"
version = "0.1.0"
description = "MCP-Server für GitHub API — Repos, Issues, Stars abfragen"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
github-mcp-server = "github_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/github_server"]
